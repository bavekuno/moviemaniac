<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Movie Maniac - Track trending movies, read critical ratings, and manage your personal watchlist.">
    <title>Movie Maniac | Discover Trending Movies</title>
    <link rel="stylesheet" href="/src/css/styles.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body class="app-body">

    <header class="site-header">
        <div class="header-inner">
            <div class="brand-row">
                <h1 class="site-logo">
                    🎬Movie <span>Maniac</span>
                </h1>
                <button id="themeToggle" class="icon-button mobile-theme-toggle" aria-label="Toggle Theme">
                    Theme
                </button>
            </div>

            <form id="searchForm" class="search-form">
                <input type="search" id="searchInput" placeholder="Search movies..." required class="search-input">
                <button type="submit" class="primary-button">
                    Search
                </button>
            </form>

            <div class="header-actions">
                <select id="genreFilter" class="genre-select">
                    <option value="all">All Genres</option>
                    <option value="28">Action</option>
                    <option value="35">Comedy</option>
                    <option value="18">Drama</option>
                    <option value="878">Sci-Fi</option>
                </select>

                <button id="desktopThemeToggle" class="icon-button" aria-label="Toggle Theme">
                    Theme
                </button>
            </div>
        </div>
    </header>

    <main class="main-shell">
        <section class="view-tabs">
            <button id="showTrendingBtn" class="tab-button is-active">
                Trending Movies
            </button>
            <button id="showWatchlistBtn" class="tab-button">
                My Watchlist (<span id="watchlistCount">0</span>)
            </button>
        </section>

        <h2 id="sectionTitle" class="section-title">Trending Movies</h2>
        <section id="movieGrid" class="movie-grid"></section>
    </main>

    <div id="movieModal" class="movie-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-panel is-scaled">
            <button id="closeModalBtn" class="modal-close" aria-label="Close Modal">
                &times;
            </button>
            <div id="modalContent" class="modal-content"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 🎬The Movie Maniac Application🎬</p>
    </footer>

    <script type="module" src="/src/js/app.js"></script>
</body>

</html>
